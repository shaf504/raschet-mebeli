<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чертёж</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      font: 16px system-ui, sans-serif;
      color: #242c36;
      background: #fff;
    }
    h1 {
      margin: 0;
      padding: 12px 16px;
      border-bottom: 1px solid #dce1e7;
      background: #f2f3f5;
      font-size: 18px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <h1>Чертёж</h1>
  <canvas aria-label="Поле для рисования">Поле для рисования</canvas>
  <script>
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d');
    const lines = new Path2D();
    const dots = new Path2D();
    const lineWidth = 2;
    let pointerId = null;
    let lastPoint;

    function resizeCanvas() {
      const { width, height } = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.lineWidth = lineWidth;
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = context.fillStyle = '#242c36';
      context.stroke(lines);
      context.fill(dots);
    }

    function getPoint(event, bounds) {
      return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
    }

    function drawTo(event) {
      const bounds = canvas.getBoundingClientRect();
      const samples = event.getCoalescedEvents?.();
      context.beginPath();
      context.moveTo(lastPoint.x, lastPoint.y);
      for (const sample of samples?.length ? samples : [event]) {
        lastPoint = getPoint(sample, bounds);
        lines.lineTo(lastPoint.x, lastPoint.y);
        context.lineTo(lastPoint.x, lastPoint.y);
      }
      context.stroke();
    }

    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0 || pointerId !== null) return;
      canvas.setPointerCapture(event.pointerId);
      pointerId = event.pointerId;
      lastPoint = getPoint(event, canvas.getBoundingClientRect());
      const dot = new Path2D();
      dot.arc(lastPoint.x, lastPoint.y, lineWidth / 2, 0, Math.PI * 2);
      dots.addPath(dot);
      context.fill(dot);
      lines.moveTo(lastPoint.x, lastPoint.y);
    });

    canvas.addEventListener('pointermove', event => {
      if (event.pointerId === pointerId) drawTo(event);
    });

    canvas.addEventListener('pointerup', event => {
      if (event.pointerId === pointerId) {
        drawTo(event);
        pointerId = null;
      }
    });

    function stopDrawing(event) {
      if (event.pointerId === pointerId) pointerId = null;
    }

    canvas.addEventListener('pointercancel', stopDrawing);
    canvas.addEventListener('lostpointercapture', stopDrawing);
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
