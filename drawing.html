<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чертёж</title>
  <style>
    :root {
      color: #242c36;
      background: #f2f3f5;
      font: 16px "IBM Plex Sans", system-ui, sans-serif;
      --line: #dce1e7;
      --accent: #1d4f91;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 16px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    h1 { margin: 0; font-size: 18px; }
    #hint { margin: 0; color: #525d6a; font-size: 13px; }
    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: minmax(0, 1fr);
      gap: 8px;
      padding: 8px;
    }
    main.calculator-open { grid-template-columns: minmax(0, 1fr) auto min(248px, 32vw); }
    .sheet {
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #eef1f4;
    }
    .paper {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #input { touch-action: none; user-select: none; cursor: crosshair; }
    #input.axis-locked { cursor: none; }
    #input.erasing { cursor: pointer; }
    .rail {
      align-self: start;
      max-height: 100%;
      overflow-y: auto;
      display: grid;
      gap: 2px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 1px 3px #242c3610;
    }
    .rail button {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      width: 78px;
      min-height: 54px;
      padding: 6px 3px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #3d4857;
      font: 500 11px/1.2 "IBM Plex Sans", system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
    }
    .rail button:hover:not(:disabled) { background: #f2f3f5; }
    .rail button[aria-pressed="true"] {
      border-color: #c8d7ed;
      background: #ebf2fc;
      color: var(--accent);
    }
    .rail button:disabled { opacity: .45; cursor: default; }
    .rail svg { width: 23px; height: 23px; }
    .rail hr { width: 70%; margin: 4px auto; border: 0; border-top: 1px solid var(--line); }
    .length {
      display: grid;
      gap: 3px;
      width: 78px;
      padding: 4px 3px;
      color: #525d6a;
      font-size: 11px;
      text-align: center;
    }
    .length input {
      width: 100%;
      min-width: 0;
      padding: 5px 2px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: inherit;
      font: inherit;
      text-align: center;
    }
    .length input[aria-invalid="true"] { border-color: #b12d38; }
    .calculator {
      align-self: start;
      min-width: 0;
      max-height: 100%;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit;
      background: #fff;
      box-shadow: 0 1px 3px #242c3610;
    }
    .calculator-head { display: flex; justify-content: space-between; align-items: center; }
    .calculator-head h2 { margin: 0; font-size: 14px; }
    #calculation {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f6f8fb;
      color: inherit;
      font: 20px system-ui, sans-serif;
      text-align: right;
    }
    #calc-status { min-height: 18px; margin: 4px 0; color: #a32b34; font-size: 12px; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .calculator button {
      min-width: 0;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f2f3f5;
      color: inherit;
      font: 16px system-ui, sans-serif;
      cursor: pointer;
    }
    .calculator-head button { width: 30px; }
    .calculator button:hover { background: #e6ebf3; }
    .keys [data-key="="] { background: var(--accent); color: #fff; }
    @media (max-width: 520px) {
      header { padding: 8px; }
      main { gap: 4px; padding: 4px; }
      .rail { padding: 3px; }
      .rail button, .length { width: 66px; }
    }
    @media (max-width: 580px) and (orientation: portrait) {
      main.calculator-open {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: minmax(0, 1fr) minmax(0, auto);
      }
      .calculator {
        grid-column: 1 / -1;
        justify-self: end;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(144px, 1.2fr);
        grid-template-rows: auto auto minmax(0, 1fr);
        align-items: start;
        gap: 4px 8px;
        width: min(360px, 100%);
        max-height: 42dvh;
      }
      .calculator-head, #calculation, #calc-status { grid-column: 1; }
      .keys { grid-column: 2; grid-row: 1 / span 3; }
      .calculator button { min-height: 30px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Чертёж</h1>
    <p id="hint">Рисуйте стилусом или мышью.</p>
  </header>
  <main>
    <div class="sheet" id="sheet">
      <div class="paper" id="paper">
        <canvas id="art" aria-hidden="true"></canvas>
        <canvas id="input" aria-label="Поле для рисования" aria-describedby="hint">Поле для рисования</canvas>
      </div>
    </div>
    <nav class="rail" aria-label="Инструменты рисования">
      <button id="free" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 8 6-6 4 4-6 6-5 1zM11 13c-9-3-11 6-5 7 3 1 6-3 10-2 2 0 3 2 6 2"/></svg>
        <span>Свободное рисование</span>
      </button>
      <button id="draft" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg>
        <span>Чертёж</span>
      </button>
      <button id="dash" type="button" aria-pressed="false" title="Штриховая линия для внутренних упоров">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m3 18 4-3m3-2 4-3m3-2 4-3"/></svg>
        <span>Штриховая</span>
      </button>
      <button id="dimension" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5v14M21 5v14M3 12h18M7 9l-4 3 4 3m10-6 4 3-4 3"/></svg>
        <span>Размер</span>
      </button>
      <button id="axes" type="button" aria-pressed="true" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V3m-3 3 3-3 3 3M3 8l18 10m-5 1 5-1-1-5M3 18 21 8M4 13l-1 5 5 1"/></svg>
        <span>По осям</span>
      </button>
      <label class="length" id="length-control" hidden>Длина, мм
        <input id="line-length" type="text" inputmode="decimal" placeholder="Авто" maxlength="10" autocomplete="off">
      </label>
      <hr>
      <button id="erase" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15 13 5a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-7 7H7zM8 10l8 8m-3 1h8"/></svg>
        <span>Удалить линию</span>
      </button>
      <button id="undo" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5-5 5 5 5M3 10h12a5 5 0 0 1 0 10h-2"/></svg>
        <span>Отменить</span>
      </button>
      <button id="open-calculator" type="button" aria-expanded="false" aria-controls="calculator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 7h8m-8 5h1m3 0h1m3 0h.1M8 16h1m3 0h1m3 0h.1M8 19h1m3 0h1m3 0h.1"/></svg>
        <span>Калькулятор</span>
      </button>
    </nav>
    <aside class="calculator" id="calculator" aria-labelledby="calculator-title" hidden>
      <div class="calculator-head">
        <h2 id="calculator-title">Калькулятор</h2>
        <button id="close-calculator" type="button" aria-label="Закрыть калькулятор">×</button>
      </div>
      <input id="calculation" aria-label="Выражение или результат" inputmode="none" autocomplete="off" spellcheck="false" maxlength="160" placeholder="0">
      <p id="calc-status" role="status"></p>
      <div class="keys" aria-label="Клавиши калькулятора">
        <button type="button" data-key="clear" aria-label="Очистить">C</button>
        <button type="button" data-key="(">(</button>
        <button type="button" data-key=")">)</button>
        <button type="button" data-key="delete" aria-label="Стереть символ">⌫</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="÷">÷</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="×">×</button>
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="−">−</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key=",">,</button>
        <button type="button" data-key="=">=</button>
        <button type="button" data-key="+">+</button>
      </div>
    </aside>
  </main>
  <script>
    const art = document.getElementById('art');
    const input = document.getElementById('input');
    const sheet = document.getElementById('sheet');
    const paper = document.getElementById('paper');
    const ink = art.getContext('2d');
    const preview = input.getContext('2d');
    const freeButton = document.getElementById('free');
    const draftButton = document.getElementById('draft');
    const dashButton = document.getElementById('dash');
    const dimensionButton = document.getElementById('dimension');
    const axesButton = document.getElementById('axes');
    const lengthControl = document.getElementById('length-control');
    const lengthInput = document.getElementById('line-length');
    const eraseButton = document.getElementById('erase');
    const undoButton = document.getElementById('undo');
    const hint = document.getElementById('hint');
    const calculator = document.getElementById('calculator');
    const calculatorButton = document.getElementById('open-calculator');
    const calculation = document.getElementById('calculation');
    const calcStatus = document.getElementById('calc-status');
    const blue = '#1d4f91';
    const inkColor = '#242c36';
    const step = 24;
    const pixelsPerMillimeter = step / 100;
    const millimeters = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2, useGrouping: false });
    const cos30 = Math.sqrt(3) / 2;
    const column = step * cos30;
    const snapRadius = 12;
    const axisDragThreshold = 8;
    const epsilon = 1e-7;
    const directions = [{ x: 0, y: 1 }, { x: cos30, y: .5 }, { x: cos30, y: -.5 }];
    const marks = [];
    const editHistory = [];
    let mode = 'free';
    let lockAxes = true;
    let erasing = false;
    let width, height;
    let zoom = 1;
    let gesture = null;
    let anchor = null;
    let hover = null;

    const offset = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const along = (a, v, length) => ({ x: a.x + v.x * length, y: a.y + v.y * length });
    const dot = (a, b) => a.x * b.x + a.y * b.y;
    const cross = (a, b) => a.x * b.y - a.y * b.x;
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function footOnSegment(point, { start, end }) {
      const vector = offset(end, start);
      const lengthSquared = dot(vector, vector);
      if (!lengthSquared) return start;
      const fraction = Math.max(0, Math.min(1, dot(offset(point, start), vector) / lengthSquared));
      return along(start, vector, fraction);
    }

    function markAt(point) {
      let bestIndex = -1;
      let bestGap = snapRadius / zoom;
      for (let i = marks.length - 1; i >= 0; i--) {
        const mark = marks[i];
        let gap;
        if (mark.kind === 'line') {
          gap = distance(point, footOnSegment(point, mark));
        } else if (mark.kind === 'dimension') {
          const { start, end } = dimensionLayout(mark);
          gap = distance(point, footOnSegment(point, { start, end }));
        } else {
          gap = distance(point, mark.start);
          for (let j = 1; j < mark.points.length; j++) {
            const foot = footOnSegment(point, { start: mark.points[j - 1], end: mark.points[j] });
            gap = Math.min(gap, distance(point, foot));
          }
        }
        if (gap < bestGap) {
          bestIndex = i;
          bestGap = gap;
        }
      }
      return bestIndex;
    }

    function joinedLine(line) {
      const origin = line.start;
      let low = 0;
      let high = distance(line.start, line.end);
      const direction = along({ x: 0, y: 0 }, offset(line.end, origin), 1 / high);
      const joined = new Set();
      let expanded;
      do {
        expanded = false;
        for (const [index, other] of marks.entries()) {
          if (joined.has(index) || other.kind !== 'line' || Boolean(other.dashed) !== line.dashed) continue;
          const start = offset(other.start, origin);
          const end = offset(other.end, origin);
          if (Math.abs(cross(start, direction)) > epsilon || Math.abs(cross(end, direction)) > epsilon) continue;
          const from = Math.min(dot(start, direction), dot(end, direction));
          const to = Math.max(dot(start, direction), dot(end, direction));
          if (from > high + epsilon || to < low - epsilon) continue;
          expanded ||= from < low - epsilon || to > high + epsilon;
          low = Math.min(low, from);
          high = Math.max(high, to);
          joined.add(index);
        }
      } while (expanded);
      return { mark: { ...line, start: along(origin, direction, low), end: along(origin, direction, high) }, joined };
    }

    function crossing(start, vector, segment, bounded = false) {
      const other = offset(segment.end, segment.start);
      const denominator = cross(vector, other);
      if (Math.abs(denominator) < epsilon) return null;
      const delta = offset(segment.start, start);
      const t = cross(delta, other) / denominator;
      const u = cross(delta, vector) / denominator;
      if (u < -epsilon || u > 1 + epsilon || (bounded && (t < -epsilon || t > 1 + epsilon))) return null;
      return along(start, vector, t);
    }

    function nearest(point, candidates, radius = snapRadius / zoom) {
      let best = null;
      for (const candidate of candidates) {
        const gap = distance(point, candidate);
        if (gap <= radius) {
          best = candidate;
          radius = gap;
        }
      }
      return best;
    }

    function gridPoint(point) {
      const i = Math.floor(point.x / column);
      return nearest(point, [i, i + 1].map(x => ({
        x: x * column,
        y: (Math.round(point.y / step - x / 2) + x / 2) * step
      })), Infinity);
    }

    function bestAxis(delta) {
      return directions.reduce((best, axis) =>
        Math.abs(dot(delta, axis)) > Math.abs(dot(delta, best)) ? axis : best);
    }

    function draftAxis(point) {
      if (!lockAxes || !anchor) return null;
      const origin = gesture && !gesture.second ? gesture.down : anchor;
      return gesture?.axis || bestAxis(offset(point, origin));
    }

    function lockGestureAxis(point) {
      if (!lockAxes || gesture.axis) return;
      const origin = gesture.second ? anchor : gesture.down;
      if (distance(point, origin) >= axisDragThreshold / zoom) gesture.axis = draftAxis(point);
    }

    function snap(point, start, direction = start && lockAxes ? bestAxis(offset(point, start)) : null) {
      const delta = start && offset(point, start);
      if (direction) point = along(start, direction, dot(delta, direction));
      const onAxis = candidate => !direction || Math.abs(cross(offset(candidate, start), direction)) < epsilon;
      const nearby = [];
      const nodes = [];
      const edges = [];

      for (const mark of marks) {
        if (mark.kind !== 'line') continue;
        const foot = footOnSegment(point, mark);
        if (distance(point, foot) > snapRadius / zoom) continue;
        nearby.push(mark);
        nodes.push(...[mark.start, mark.end].filter(onAxis));
        const target = direction ? crossing(start, direction, mark) : foot;
        if (target) edges.push(target);
        else if (onAxis(foot)) edges.push(foot);
      }

      for (let i = 0; i < nearby.length; i++) {
        const { start: lineStart, end } = nearby[i];
        const vector = offset(end, lineStart);
        for (let j = i + 1; j < nearby.length; j++) {
          const node = crossing(lineStart, vector, nearby[j], true);
          if (node && onAxis(node)) nodes.push(node);
        }
      }

      const feature = nearest(point, nodes) || nearest(point, edges);
      if (feature) return { point: feature, feature: true };
      if (direction) return { point: along(start, direction, Math.round(dot(delta, direction) / step) * step) };
      const grid = gridPoint(point);
      return { point: lockAxes || distance(point, grid) <= 7 ? grid : point };
    }

    function specifiedLength() {
      const text = lengthInput.value.trim();
      if (!text || mode === 'dimension') return undefined;
      const length = Number(text.replace(',', '.'));
      return /^(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(text) && length > 0 ? length : null;
    }

    function draftEnd(point) {
      const direction = draftAxis(point);
      const length = specifiedLength();
      if (anchor && length === null) return { point: anchor };
      if (!anchor || length === undefined) return snap(point, anchor, direction);
      const delta = offset(point, anchor);
      const gap = distance(point, anchor);
      if (gap < epsilon) return { point: anchor };
      const normal = direction || along({ x: 0, y: 0 }, delta, 1 / gap);
      const sign = dot(delta, normal) < 0 ? -1 : 1;
      return { point: along(anchor, normal, length * pixelsPerMillimeter * sign) };
    }

    function drawLine(context, start, end) {
      context.beginPath();
      context.moveTo(start.x, start.y);
      context.lineTo(end.x, end.y);
      context.stroke();
    }

    function drawDot(context, point, radius) {
      context.beginPath();
      context.arc(point.x, point.y, radius, 0, Math.PI * 2);
      context.fill();
    }

    function dimensionLayout(mark) {
      const length = distance(mark.start, mark.end);
      const unit = along({ x: 0, y: 0 }, offset(mark.end, mark.start), 1 / length);
      const reverse = unit.x < -epsilon || (Math.abs(unit.x) <= epsilon && unit.y < 0);
      const direction = reverse ? { x: -unit.x, y: -unit.y } : unit;
      const normal = { x: direction.y, y: -direction.x };
      const from = reverse ? mark.end : mark.start;
      const to = reverse ? mark.start : mark.end;
      return { from, to, start: along(from, normal, 24), end: along(to, normal, 24), direction, normal, length };
    }

    function drawDimension(context, mark, color) {
      const { from, to, start, end, direction, normal, length } = dimensionLayout(mark);
      const label = `${millimeters.format(length / pixelsPerMillimeter)} мм`;
      const arrow = Math.min(8, length / 3);
      context.save();
      context.lineWidth = 1;
      context.strokeStyle = color;
      drawLine(context, along(from, normal, 3), along(start, normal, 5));
      drawLine(context, along(to, normal, 3), along(end, normal, 5));
      drawLine(context, start, end);
      for (const [tip, side] of [[start, 1], [end, -1]]) {
        const base = along(tip, direction, arrow * side);
        const a = along(base, normal, arrow / 3);
        const b = along(base, normal, -arrow / 3);
        context.beginPath();
        context.moveTo(a.x, a.y);
        context.lineTo(tip.x, tip.y);
        context.lineTo(b.x, b.y);
        context.stroke();
      }
      context.font = '600 12px system-ui, sans-serif';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      const labelWidth = context.measureText(label).width + 6;
      const center = along(start, direction, length / 2);
      const labelCenter = labelWidth + arrow * 2 < length ? center : along(center, normal, 12);
      context.translate(labelCenter.x, labelCenter.y);
      context.rotate(Math.atan2(direction.y, direction.x));
      context.fillStyle = '#fff';
      context.fillRect(-labelWidth / 2, -8, labelWidth, 16);
      context.fillStyle = color;
      context.fillText(label, 0, 0);
      context.restore();
    }

    function drawGrid() {
      const shift = width / Math.sqrt(3);
      ink.beginPath();
      for (let x = 0; x < width; x += column) {
        ink.moveTo(x, 0);
        ink.lineTo(x, height);
      }
      for (let y = -Math.ceil(shift / step) * step; y < height + shift; y += step) {
        ink.moveTo(0, y);
        ink.lineTo(width, y + shift);
        ink.moveTo(0, y);
        ink.lineTo(width, y - shift);
      }
      ink.strokeStyle = '#e9eef5';
      ink.lineWidth = 1;
      ink.stroke();
    }

    function drawMark(context, mark, color = inkColor, lineWidth = 2) {
      context.lineWidth = lineWidth;
      context.strokeStyle = context.fillStyle = color;
      if (mark.kind === 'line') {
        if (mark.dashed) context.setLineDash([8, 5]);
        drawLine(context, mark.start, mark.end);
        if (mark.dashed) context.setLineDash([]);
      } else if (mark.kind === 'dimension') {
        drawDimension(context, mark, color === inkColor ? blue : color);
      } else {
        drawDot(context, mark.start, lineWidth / 2);
        context.stroke(mark.path);
      }
    }

    function paintSheet() {
      ink.clearRect(0, 0, width, height);
      if (mode !== 'free') drawGrid();
      for (const mark of marks) drawMark(ink, mark);
    }

    function paintPreview() {
      undoButton.disabled = editHistory.length === 0 && !anchor;
      input.classList.toggle('axis-locked', Boolean(gesture?.axis));
      preview.clearRect(0, 0, width, height);
      if (erasing) {
        const index = hover ? markAt(hover) : -1;
        if (index >= 0) drawMark(preview, marks[index], '#b12d38', 4);
        return;
      }
      if (gesture?.mark) drawMark(preview, gesture.mark);
      if (mode === 'free') return;
      if (gesture?.axis) {
        const extent = Math.hypot(width, height);
        preview.strokeStyle = '#86a8d2';
        preview.lineWidth = 1;
        preview.setLineDash([5, 5]);
        drawLine(preview, along(anchor, gesture.axis, -extent), along(anchor, gesture.axis, extent));
        preview.setLineDash([]);
      }
      preview.strokeStyle = preview.fillStyle = blue;
      preview.lineWidth = 2;
      if (anchor) drawDot(preview, anchor, 3.5);
      if (!hover) return;
      if (lockAxes && gesture && !gesture.second && !gesture.axis) return;
      const target = draftEnd(hover);
      if (anchor && distance(anchor, target.point) >= epsilon) {
        if (mode === 'dimension') drawDimension(preview, { start: anchor, end: target.point }, blue);
        else drawMark(preview, { kind: 'line', start: anchor, end: target.point, dashed: mode === 'dash' }, blue);
      }
      if (target.feature) {
        drawDot(preview, target.point, 4);
      } else {
        preview.beginPath();
        preview.arc(target.point.x, target.point.y, 4, 0, Math.PI * 2);
        preview.stroke();
      }
    }

    function resize() {
      const viewWidth = sheet.clientWidth;
      const viewHeight = sheet.clientHeight;
      if (!viewWidth || !viewHeight) return;
      if (!width || (calculator.hidden && viewWidth >= width && viewHeight >= height)) {
        width = viewWidth;
        height = viewHeight;
      }
      zoom = Math.min(viewWidth / width, viewHeight / height);
      paper.style.width = `${width * zoom}px`;
      paper.style.height = `${height * zoom}px`;
      const scale = (window.devicePixelRatio || 1) * zoom;
      for (const context of [ink, preview]) {
        context.canvas.width = Math.round(width * scale);
        context.canvas.height = Math.round(height * scale);
        context.setTransform(scale, 0, 0, scale, 0, 0);
        context.lineCap = context.lineJoin = 'round';
      }
      paintSheet();
      paintPreview();
    }

    function fromPointer(event, bounds = input.getBoundingClientRect()) {
      return { x: (event.clientX - bounds.left) / zoom, y: (event.clientY - bounds.top) / zoom };
    }

    function extendFreehand(event) {
      const { mark } = gesture;
      const bounds = input.getBoundingClientRect();
      const samples = event.getCoalescedEvents?.();
      preview.strokeStyle = inkColor;
      preview.lineWidth = 2;
      preview.beginPath();
      preview.moveTo(mark.end.x, mark.end.y);
      for (const sample of samples?.length ? samples : [event]) {
        mark.end = fromPointer(sample, bounds);
        mark.points.push(mark.end);
        mark.path.lineTo(mark.end.x, mark.end.y);
        preview.lineTo(mark.end.x, mark.end.y);
      }
      preview.stroke();
    }

    function cancel() {
      const id = gesture?.id;
      gesture = anchor = hover = null;
      if (id !== undefined && input.hasPointerCapture(id)) input.releasePointerCapture(id);
      paintPreview();
    }

    function updateTools() {
      freeButton.setAttribute('aria-pressed', mode === 'free');
      draftButton.setAttribute('aria-pressed', mode === 'draft');
      dashButton.setAttribute('aria-pressed', mode === 'dash');
      dimensionButton.setAttribute('aria-pressed', mode === 'dimension');
      axesButton.hidden = mode === 'free';
      lengthControl.hidden = mode !== 'draft' && mode !== 'dash';
      lengthInput.setAttribute('aria-invalid', specifiedLength() === null);
      eraseButton.setAttribute('aria-pressed', erasing);
      input.classList.toggle('erasing', erasing);
      hint.textContent = 'Рисуйте стилусом или мышью.';
      if (mode === 'draft' || mode === 'dash') hint.textContent = 'Проведите линию или коснитесь двух точек. Шаг сетки — 100 мм.';
      if (mode === 'dimension') hint.textContent = 'Выберите две точки, чтобы проставить размер в миллиметрах.';
      if (!lengthControl.hidden && specifiedLength() === null) hint.textContent = 'Введите длину больше нуля или оставьте поле пустым.';
      if (erasing) hint.textContent = 'Коснитесь линии, которую хотите удалить.';
    }

    function setMode(nextMode) {
      if (mode === nextMode && !erasing) return;
      mode = nextMode;
      erasing = false;
      cancel();
      updateTools();
      paintSheet();
    }

    function undo() {
      if (!anchor && !gesture) {
        const change = editHistory.pop();
        if (change?.added) marks.pop();
        for (const { index, mark } of change?.removed || []) marks.splice(index, 0, mark);
      }
      cancel();
      paintSheet();
    }

    function addMark(mark) {
      const removed = [];
      if (mark.kind === 'line') {
        const combined = joinedLine(mark);
        for (const index of [...combined.joined].sort((a, b) => b - a)) {
          const [previous] = marks.splice(index, 1);
          removed.unshift({ index, mark: previous });
        }
        mark = combined.mark;
      }
      editHistory.push({ added: true, removed });
      marks.push(mark);
      if (removed.length) paintSheet();
      else drawMark(ink, mark);
    }

    freeButton.addEventListener('click', () => setMode('free'));
    draftButton.addEventListener('click', () => setMode('draft'));
    dashButton.addEventListener('click', () => setMode('dash'));
    dimensionButton.addEventListener('click', () => setMode('dimension'));
    lengthInput.addEventListener('input', () => {
      updateTools();
      paintPreview();
    });
    axesButton.addEventListener('click', () => {
      lockAxes = !lockAxes;
      if (gesture) gesture.axis = null;
      axesButton.setAttribute('aria-pressed', lockAxes);
      paintPreview();
    });
    eraseButton.addEventListener('click', () => {
      erasing = !erasing;
      cancel();
      updateTools();
    });
    undoButton.addEventListener('click', undo);

    input.addEventListener('pointerdown', event => {
      if (event.button !== 0 || gesture) return;
      input.setPointerCapture(event.pointerId);
      const point = fromPointer(event);
      gesture = { id: event.pointerId, down: point };
      if (erasing) {
        hover = point;
      } else if (mode !== 'free') {
        gesture.second = Boolean(anchor);
        anchor ??= snap(point).point;
        if (gesture.second) lockGestureAxis(point);
        hover = gesture.second ? point : anchor;
      } else {
        const path = new Path2D();
        path.moveTo(point.x, point.y);
        gesture.mark = { kind: 'free', path, start: point, end: point, points: [point] };
      }
      paintPreview();
    });

    input.addEventListener('pointermove', event => {
      if (gesture && event.pointerId !== gesture.id) return;
      if (erasing || mode !== 'free') {
        hover = fromPointer(event);
        if (!erasing && gesture) lockGestureAxis(hover);
        paintPreview();
      } else if (gesture) {
        extendFreehand(event);
      }
    });

    input.addEventListener('pointerup', event => {
      if (event.pointerId !== gesture?.id) return;
      const point = fromPointer(event);
      let mark = gesture.mark;
      if (erasing) {
        const index = markAt(point);
        if (index >= 0) {
          const [removed] = marks.splice(index, 1);
          editHistory.push({ removed: [{ index, mark: removed }] });
          paintSheet();
        }
        hover = event.pointerType === 'touch' ? null : point;
      } else if (mark) {
        extendFreehand(event);
      } else {
        const threshold = (lockAxes ? axisDragThreshold : 4) / zoom;
        if (gesture.second || distance(point, gesture.down) >= threshold) {
          const end = draftEnd(point).point;
          if (distance(anchor, end) >= epsilon) {
            const kind = mode === 'dimension' ? 'dimension' : 'line';
            mark = { kind, start: anchor, end, dashed: mode === 'dash' };
          }
          anchor = null;
        }
        hover = event.pointerType === 'touch' ? null : point;
      }
      if (mark) addMark(mark);
      gesture = null;
      paintPreview();
    });

    for (const eventName of ['pointercancel', 'lostpointercapture']) {
      input.addEventListener(eventName, event => {
        if (event.pointerId === gesture?.id) cancel();
      });
    }
    input.addEventListener('pointerleave', () => {
      hover = null;
      paintPreview();
    });
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (calculator.contains(event.target)) {
          setCalculator(false);
          calculatorButton.focus();
          return;
        }
        erasing = false;
        cancel();
        updateTools();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z' && !event.shiftKey) {
        if (event.target === calculation || event.target === lengthInput) return;
        event.preventDefault();
        undo();
      }
    });
    resize();
    new ResizeObserver(resize).observe(sheet);

    let calculated = false;

    function calculate(source) {
      const text = source.replace(/\s/g, '').replaceAll(',', '.').replaceAll('×', '*')
        .replaceAll('÷', '/').replaceAll('−', '-');
      const number = /(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/iy;
      let position = 0;

      function factor() {
        const operator = text[position];
        if (operator === '+' || operator === '-') {
          position++;
          return (operator === '-' ? -1 : 1) * factor();
        }
        if (operator === '(') {
          position++;
          const result = expression();
          if (text[position++] !== ')') throw new Error('Закройте скобку');
          return result;
        }
        number.lastIndex = position;
        const match = number.exec(text);
        if (!match) throw new Error('Проверьте выражение');
        position = number.lastIndex;
        return Number(match[0]);
      }

      function product() {
        let result = factor();
        while (text[position] === '*' || text[position] === '/') {
          const operator = text[position++];
          const operand = factor();
          if (operator === '/' && operand === 0) throw new Error('Деление на ноль');
          result = operator === '*' ? result * operand : result / operand;
        }
        return result;
      }

      function expression() {
        let result = product();
        while (text[position] === '+' || text[position] === '-') {
          const operator = text[position++];
          const operand = product();
          result = operator === '+' ? result + operand : result - operand;
        }
        return result;
      }

      const result = expression();
      if (position !== text.length) throw new Error('Проверьте выражение');
      if (!Number.isFinite(result)) throw new Error('Слишком большое число');
      return String(Number(result.toPrecision(15))).replace('.', ',');
    }

    function showResult() {
      if (!calculation.value.trim()) return;
      try {
        calculation.value = calculate(calculation.value);
        calcStatus.textContent = '';
        calculated = true;
      } catch (error) {
        calcStatus.textContent = error.message;
      }
    }

    function setCalculator(open) {
      calculator.hidden = !open;
      sheet.parentElement.classList.toggle('calculator-open', open);
      calculatorButton.setAttribute('aria-expanded', open);
      hover = null;
      resize();
    }

    calculatorButton.addEventListener('click', () => setCalculator(calculator.hidden));
    document.getElementById('close-calculator').addEventListener('click', () => {
      setCalculator(false);
      calculatorButton.focus();
    });

    calculator.addEventListener('click', event => {
      const key = event.target.closest('[data-key]')?.dataset.key;
      if (!key) return;
      calcStatus.textContent = '';
      if (key === '=') {
        showResult();
      } else {
        let start = calculation.selectionStart;
        const end = calculation.selectionEnd;
        if (key === 'clear') {
          calculation.value = '';
        } else if (key === 'delete') {
          if (start === end) start = Math.max(0, start - 1);
          calculation.setRangeText('', start, end, 'end');
        } else if (calculated && /^[\d,(]$/.test(key)) {
          calculation.value = key;
        } else if (calculation.value.length - (end - start) < calculation.maxLength) {
          calculation.setRangeText(key, start, end, 'end');
        }
        calculated = false;
      }
      calculation.focus();
    });

    calculation.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      showResult();
    });
    calculation.addEventListener('beforeinput', event => {
      if (calculated && event.inputType === 'insertText' && /^[\d.,(]/.test(event.data || '')) calculation.select();
    });
    calculation.addEventListener('input', () => {
      calculated = false;
      calcStatus.textContent = '';
    });
  </script>
</body>
</html>
